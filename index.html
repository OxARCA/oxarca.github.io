<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1efe9" />
    <meta name="description" content="Coming soon." />
    <title>Coming Soon</title>

    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f1efe9;
        color: #171713;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 2rem;
      }

      .loading {
        display: grid;
        justify-items: center;
        gap: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1rem, 2vw, 1.2rem);
        font-weight: 500;
        letter-spacing: 0.24em;
        line-height: 1;
        text-transform: uppercase;
      }

      .indicator {
        width: 3rem;
        height: 1px;
        overflow: hidden;
        background: rgb(23 23 19 / 18%);
      }

      .indicator::after {
        display: block;
        width: 45%;
        height: 100%;
        background: currentColor;
        content: "";
        animation: loading 1.4s ease-in-out infinite;
      }

      @keyframes loading {
        from {
          transform: translateX(-100%);
        }

        to {
          transform: translateX(225%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .indicator::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <div class="loading">
        <h1>Coming Soon</h1>
        <div class="indicator" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
